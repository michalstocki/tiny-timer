<text x="20.000" y="221.000" font-family="Helvetica, Arial, sans-serif" font-size="2.800" fill="#333" text-anchor="start" font-weight="normal">Przed lutowaniem przewodów, na przycisku (nawet luźnym): nóżki 4–3 (12,5 mm) oraz 2–1 mają mieć ciągłość zawsze,</text>
<text x="20.000" y="225.200" font-family="Helvetica, Arial, sans-serif" font-size="2.800" fill="#333" text-anchor="start" font-weight="normal">a 4–2 oraz 3–1 (5,0 mm) tylko po wciśnięciu. Jeśli jest odwrotnie, przycisk nie jest zgodny z kartą:</text>
<text x="20.000" y="229.400" font-family="Helvetica, Arial, sans-serif" font-size="2.800" fill="#333" text-anchor="start" font-weight="normal">nie lutuj dalej i zmierz wszystkie sześć par nóżek.</text>
<text x="20.000" y="290.000" font-family="Helvetica, Arial, sans-serif" font-size="2.400" fill="#666" text-anchor="start" font-weight="normal">Źródło połączeń wewnętrznych: Omron B3F (A070-E1-08), s. 6. Sprawdzone programowo: tools/pcb/button_board.py</text>
