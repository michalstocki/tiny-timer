<text x="20.000" y="112.200" font-family="Helvetica, Arial, sans-serif" font-size="2.800" fill="#333" text-anchor="start" font-weight="normal">Szczegóły: docs/schemat.md. Każdy przycisk jest na płytce uniwersalnej połączony z polami KEY krótkimi przewodami (strona 2).</text>
