<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podgląd 3D płytki: minutnik ATtiny13A</title>
<style>
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:#f4f4f2;color:#222}
#bar{position:fixed;top:8px;left:8px;background:#fffd;padding:8px 10px;border-radius:8px;font-size:13px;z-index:2}
#bar button{margin:2px;padding:4px 8px;cursor:pointer}
canvas{display:block}
#note{position:fixed;bottom:8px;left:8px;font-size:12px;color:#555;background:#fffc;padding:6px 8px;border-radius:6px}
</style></head><body>
<div id="bar"><b>Płytka 48 × 50 mm</b> &nbsp;
<button onclick="view('front')">przód</button><button onclick="view('back')">tył</button>
<button onclick="view('side')">bok</button><button onclick="view('iso')">ukośnie</button>
<label><input type="checkbox" id="expl" onchange="explode()"> rozsunięcie</label></div>
<div id="note">Przeciągnij myszą, aby obracać; kółko: zoom. Wymiary w mm. Przód (góra) = wyświetlacz i przyciski; tył = reszta. Wymiary oznaczone w specyfikacji jako „szacunkowe” to estymaty.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = {"units": "mm", "frame": "front view (top side), origin lower-left of the outline, +x right, +y up", "board": {"width": 48.0, "height": 50.0, "thickness": 1.6, "corner_radius": 3.0}, "mounting_holes": [{"x": 3.5, "y": 3.5, "diameter": 2.7, "keepout_radius": 3.2}, {"x": 44.5, "y": 3.5, "diameter": 2.7, "keepout_radius": 3.2}, {"x": 3.5, "y": 46.5, "diameter": 2.7, "keepout_radius": 3.2}, {"x": 44.5, "y": 46.5, "diameter": 2.7, "keepout_radius": 3.2}], "parts": {"OLED": {"footprint": "oled", "side": "top", "value": "SSD1306 128x32 module", "rotation": 0, "height_above_board": 6.5, "pads": {"SDA": {"x": 6.5, "y": 36.31}, "SCL": {"x": 6.5, "y": 33.77}, "VCC": {"x": 6.5, "y": 31.23}, "GND": {"x": 6.5, "y": 28.69}}, "body": [5.0, 26.5, 43.0, 38.5]}, "S3": {"footprint": "b3f", "side": "top", "value": "B3F-4055 (-)", "rotation": 0, "height_above_board": 7.3, "pads": {"4": {"x": 1.75, "y": 20.0}, "3": {"x": 14.25, "y": 20.0}, "2": {"x": 1.75, "y": 15.0}, "1": {"x": 14.25, "y": 15.0}}, "body": [2.0, 11.5, 14.0, 23.5]}, "S1": {"footprint": "b3f", "side": "top", "value": "B3F-4055 (run)", "rotation": 0, "height_above_board": 7.3, "pads": {"4": {"x": 17.75, "y": 20.0}, "3": {"x": 30.25, "y": 20.0}, "2": {"x": 17.75, "y": 15.0}, "1": {"x": 30.25, "y": 15.0}}, "body": [18.0, 11.5, 30.0, 23.5]}, "S2": {"footprint": "b3f", "side": "top", "value": "B3F-4055 (+)", "rotation": 0, "height_above_board": 7.3, "pads": {"4": {"x": 33.75, "y": 20.0}, "3": {"x": 46.25, "y": 20.0}, "2": {"x": 33.75, "y": 15.0}, "1": {"x": 46.25, "y": 15.0}}, "body": [34.0, 11.5, 46.0, 23.5]}, "U1": {"footprint": "dip8", "side": "bottom", "value": "ATtiny13A in DIP-8 socket", "rotation": 0, "height_above_board": 4.5, "pads": {"1": {"x": 18.5, "y": 10.05}, "2": {"x": 18.5, "y": 7.51}, "3": {"x": 18.5, "y": 4.97}, "4": {"x": 18.5, "y": 2.43}, "5": {"x": 10.88, "y": 2.43}, "6": {"x": 10.88, "y": 4.97}, "7": {"x": 10.88, "y": 7.51}, "8": {"x": 10.88, "y": 10.05}}, "body": [9.5, 1.15, 19.9, 11.45]}, "R1": {"footprint": "res_v", "side": "bottom", "value": "15 k", "rotation": 0, "height_above_board": 7.5, "pads": {"1": {"x": 24.2, "y": 10.0}, "2": {"x": 21.66, "y": 10.0}}, "body": [20.2, 8.5, 25.7, 11.5]}, "R2": {"footprint": "res_v", "side": "bottom", "value": "470", "rotation": 90, "height_above_board": 7.5, "pads": {"1": {"x": 27.0, "y": 42.3}, "2": {"x": 27.0, "y": 39.76}}, "body": [25.5, 38.3, 28.5, 43.8]}, "R3": {"footprint": "res_v", "side": "bottom", "value": "47 k", "rotation": 180, "height_above_board": 7.5, "pads": {"1": {"x": 37.3, "y": 39.8}, "2": {"x": 39.84, "y": 39.8}}, "body": [35.8, 38.3, 41.3, 41.3]}, "R4": {"footprint": "res_h", "side": "bottom", "value": "33, 1/2 W", "rotation": 0, "height_above_board": 4.0, "pads": {"1": {"x": 26.95, "y": 45.5}, "2": {"x": 14.25, "y": 45.5}}, "body": [16.05, 43.5, 25.15, 47.5]}, "R5": {"footprint": "res_v", "side": "bottom", "value": "8.2 k", "rotation": 90, "height_above_board": 7.5, "pads": {"1": {"x": 28.2, "y": 8.25}, "2": {"x": 28.2, "y": 5.71}}, "body": [26.7, 4.25, 29.7, 9.75]}, "R6": {"footprint": "res_v", "side": "bottom", "value": "8.2 k", "rotation": 0, "height_above_board": 7.5, "pads": {"1": {"x": 7.35, "y": 10.2}, "2": {"x": 4.81, "y": 10.2}}, "body": [3.35, 8.7, 8.85, 11.7]}, "C1": {"footprint": "cap5", "side": "bottom", "value": "100 nF", "rotation": 0, "height_above_board": 6.0, "pads": {"1": {"x": 25.9, "y": 5.75}, "2": {"x": 20.82, "y": 5.75}}, "body": [20.3, 3.55, 26.4, 7.95]}, "C2": {"footprint": "cap5", "side": "bottom", "value": "100 nF", "rotation": 90, "height_above_board": 6.0, "pads": {"1": {"x": 3.65, "y": 33.95}, "2": {"x": 3.65, "y": 28.87}}, "body": [1.45, 28.35, 5.85, 34.45]}, "C3": {"footprint": "elco5", "side": "bottom", "value": "100 uF", "rotation": 0, "height_above_board": 8.0, "pads": {"+": {"x": 23.65, "y": 40.0}, "-": {"x": 21.11, "y": 40.0}}, "body": [19.85, 37.4, 24.85, 42.6]}, "D1": {"footprint": "led", "side": "bottom", "value": "LED", "rotation": 270, "height_above_board": 8.7, "pads": {"A": {"x": 34.9, "y": 43.0}, "K": {"x": 34.9, "y": 45.54}}, "body": [32.2, 41.7, 37.6, 46.9]}, "Q1": {"footprint": "to92", "side": "bottom", "value": "BC547B", "rotation": 180, "height_above_board": 5.5, "pads": {"C": {"x": 29.66, "y": 40.35}, "B": {"x": 32.2, "y": 40.35}, "E": {"x": 34.74, "y": 40.35}}, "body": [29.6, 36.15, 34.8, 41.05]}, "SPK": {"footprint": "wire2", "side": "bottom", "value": "speaker leads", "rotation": 90, "height_above_board": 0.0, "pads": {"1": {"x": 30.7, "y": 45.4}, "2": {"x": 30.7, "y": 42.86}}, "body": [29.5, 41.6, 31.9, 46.6]}, "BAT": {"footprint": "wire2", "side": "bottom", "value": "battery leads", "rotation": 180, "height_above_board": 0.0, "pads": {"1": {"x": 15.55, "y": 40.1}, "2": {"x": 18.09, "y": 40.1}}, "body": [14.35, 38.9, 19.35, 41.3]}}, "nets": {"VCC": [["U1", "8"], ["R1", "2"], ["R5", "2"], ["R4", "2"], ["C1", "2"], ["C2", "2"], ["C3", "+"], ["OLED", "VCC"], ["BAT", "1"]], "GND": [["U1", "4"], ["Q1", "E"], ["R3", "2"], ["R6", "2"], ["C1", "1"], ["C2", "1"], ["C3", "-"], ["OLED", "GND"], ["BAT", "2"], ["S1", "2"], ["S1", "1"], ["S2", "2"], ["S2", "1"]], "RESET": [["U1", "1"], ["R1", "1"]], "PB3": [["U1", "2"], ["S1", "4"], ["S1", "3"]], "PB4": [["U1", "3"], ["R5", "1"], ["S2", "4"], ["S2", "3"], ["S3", "4"], ["S3", "3"]], "S3LOW": [["S3", "2"], ["S3", "1"], ["R6", "1"]], "SDA": [["U1", "5"], ["OLED", "SDA"]], "SCL": [["U1", "7"], ["OLED", "SCL"]], "PB1": [["U1", "6"], ["R2", "1"]], "BASE": [["R2", "2"], ["Q1", "B"], ["R3", "1"]], "COLL": [["Q1", "C"], ["SPK", "2"], ["D1", "A"]], "SPKR": [["SPK", "1"], ["D1", "K"], ["R4", "1"]]}, "derived": {"board_center": [24.0, 25.0], "oled_module": {"rect": [5.0, 26.5, 43.0, 38.5], "pcb_thickness_assumed": 1.2, "total_thickness_above_board": 6.5, "glass_rect": [11.5, 27.5, 36.5, 37.5]}, "buttons": {"S3": {"centre": [8.0, 17.5], "body": 12.0, "plunger_square": 3.8, "cap_diameter": 7.1, "top_above_board": 7.3, "label": "minus"}, "S1": {"centre": [24.0, 17.5], "body": 12.0, "plunger_square": 3.8, "cap_diameter": 7.1, "top_above_board": 7.3, "label": "run"}, "S2": {"centre": [40.0, 17.5], "body": 12.0, "plunger_square": 3.8, "cap_diameter": 7.1, "top_above_board": 7.3, "label": "plus"}}, "back_envelope_height": 9.0, "front_free_zone_above_board": "everything on the front except the OLED module and the buttons must stay below 2.0 mm (solder joints of the back parts)"}};
const W = DATA.board.width, H = DATA.board.height, T = DATA.board.thickness;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f4f2);
const cam = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 1, 1000);
const ren = new THREE.WebGLRenderer({antialias:true}); ren.setSize(innerWidth, innerHeight); document.body.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const dl = new THREE.DirectionalLight(0xffffff, 0.7); dl.position.set(-60, -80, 120); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.35); dl2.position.set(80, 60, -90); scene.add(dl2);
// board frame: x right, y up, z towards the viewer of the FRONT side; board top surface at z = 0
const root = new THREE.Group(); scene.add(root);
function box(x0,y0,x1,y1,z0,z1,color,grp){
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0), new THREE.MeshLambertMaterial({color}));
  m.position.set((x0+x1)/2-W/2,(y0+y1)/2-H/2,(z0+z1)/2); (grp||root).add(m); return m; }
function cyl(x,y,r,z0,z1,color,grp){
  const g = new THREE.CylinderGeometry(r,r,z1-z0,24); g.rotateX(Math.PI/2);
  const m = new THREE.Mesh(g,new THREE.MeshLambertMaterial({color})); m.position.set(x-W/2,y-H/2,(z0+z1)/2); (grp||root).add(m); return m; }
const front = new THREE.Group(), back = new THREE.Group(); root.add(front); root.add(back);
box(0,0,W,H,-T,0,0x2f6b3a);
DATA.mounting_holes.forEach(h=>{ const c=cyl(h.x,h.y,h.diameter/2,-T-0.05,0.05,0xf4f4f2); });
const o = DATA.derived.oled_module, g = o.glass_rect, so = 2.5;
box(o.rect[0],o.rect[1],o.rect[2],o.rect[3],so,so+1.2,0x16335f,front);
box(g[0],g[1],g[2],g[3],so+1.2,o.total_thickness_above_board,0x05070b,front);
box(DATA.parts.OLED.pads.SDA.x-1.3,DATA.parts.OLED.pads.GND.y-0.0,DATA.parts.OLED.pads.SDA.x+1.3,DATA.parts.OLED.pads.SDA.y,0,so,0x333333,front);
['S3','S1','S2'].forEach(r=>{ const b=DATA.derived.buttons[r], c=b.centre;
  box(c[0]-6,c[1]-6,c[0]+6,c[1]+6,0,4.3,0x3a3a40,front);
  cyl(c[0],c[1],b.cap_diameter/2,4.3,5.5,0x202024,front);
  box(c[0]-1.9,c[1]-1.9,c[0]+1.9,c[1]+1.9,5.5,b.top_above_board,0x666666,front); });
for (const [ref,p] of Object.entries(DATA.parts)) {
  if (p.side!=='bottom'||!p.body) continue; const b=p.body, h=p.height_above_board;
  if (ref==='U1'){ box(b[0],b[1],b[2],b[3],-T-4.5,-T,0x2b2b30,back); box(b[0]+1.2,b[1]+1.2,b[2]-1.2,b[3]-1.2,-T-8.5,-T-4.5,0x111111,back); }
  else if (ref==='C3'){ cyl((b[0]+b[2])/2,(b[1]+b[3])/2,2.5,-T-h,-T,0x243b6b,back); }
  else { const col = ref==='D1'?0xff8a8a:(ref==='Q1'?0x222222:0xe8d3a6); box(b[0],b[1],b[2],b[3],-T-h,-T,col,back); }
}
let theta=0.0, phi=0.0, dist=140, tgt=new THREE.Vector3(0,0,0), curView='iso';
function setCam(){ cam.up.set(0,1,0);
  const x=dist*Math.sin(theta)*Math.cos(phi), y=dist*Math.sin(phi), z=dist*Math.cos(theta)*Math.cos(phi);
  cam.position.set(tgt.x+x,tgt.y+y,tgt.z+z); cam.lookAt(tgt); }
function view(v){ curView=v; if(v==='front'){theta=0;phi=0;} if(v==='back'){theta=Math.PI;phi=0;} if(v==='side'){theta=Math.PI/2;phi=0;} if(v==='iso'){theta=0.6;phi=0.5;} setCam(); }
function explode(){ const e=document.getElementById('expl').checked; front.position.z=e?14:0; back.position.z=e?-14:0; }
let drag=null; ren.domElement.addEventListener('mousedown',e=>{drag=[e.clientX,e.clientY];});
addEventListener('mouseup',()=>drag=null);
addEventListener('mousemove',e=>{ if(!drag) return; theta-=(e.clientX-drag[0])*0.008; phi+=(e.clientY-drag[1])*0.008; phi=Math.max(-1.5,Math.min(1.5,phi)); drag=[e.clientX,e.clientY]; setCam(); });
addEventListener('wheel',e=>{ dist*=e.deltaY>0?1.08:0.92; setCam(); });
addEventListener('resize',()=>{ ren.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); });
view('iso'); (function loop(){ requestAnimationFrame(loop); ren.render(scene,cam); })();
</script></body></html>
